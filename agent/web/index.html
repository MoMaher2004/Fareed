<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fareed AI Assistant</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Prism.js (Syntax Highlighting) -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
  <link rel="stylesheet" href="code-viewer.css">
  <link rel="stylesheet" href="command-viewer.css">
  <link rel="stylesheet" href="audio-player.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar futuristic-navbar">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-stars me-2"></i> Fareed
      </a>
      <div class="d-flex align-items-center gap-2 gap-md-3">
        <!-- Theme Toggle -->
        <button class="btn btn-sm btn-outline-future" id="themeToggle" title="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <!-- Left Drawer: chats List -->
        <button class="btn btn-sm btn-outline-future" data-bs-toggle="offcanvas" data-bs-target="#chatsDrawer" title="All chats">
          <i class="bi bi-chat-left-text"></i>
        </button>
        <!-- Right Drawer: Current Chat History -->
        <button class="btn btn-sm btn-outline-future" data-bs-toggle="offcanvas" data-bs-target="#historyDrawer" title="Message History">
          <i class="bi bi-clock-history"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Chat Window -->
  <main class="chat-container">
    <div id="chatMessages" class="chat-messages">
      <div class="message ai-message">
        <div class="message-header"><i class="bi bi-robot me-1"></i> Fareed</div>
        <div class="message-content">Hello! I'm Fareed. How can I assist you today?</div>
      </div>
    </div>

    <!-- Hot Answers / Suggestions (optional) -->
    <div id="hotAnswers" class="hot-answers"></div>

    <!-- Input Area with Drag & Drop -->
    <div class="input-area" id="dropZone">
      <div id="attachmentPreview" class="attachment-preview d-none"></div>
      <div class="input-wrapper">
        <textarea id="userInput" class="form-control futuristic-textarea" placeholder="Type your message..." rows="1"></textarea>
        <div class="input-actions">
          <label for="fileUpload" class="action-btn" title="Upload Files">
            <i class="bi bi-paperclip"></i>
            <input type="file" id="fileUpload" class="d-none" multiple accept=".jpg,.jpeg,.png,.gif,.pdf,.txt,.py,.html,.css,.js,.json,.mp3,.wav,.mp4">
          </label>
          <button class="action-btn" id="voiceInputBtn" title="Voice Input">
            <i class="bi bi-mic"></i>
          </button>
          <div class="form-check form-switch ms-1 align-self-center" title="Send as System Message">
            <input class="form-check-input futuristic-switch" type="checkbox" id="systemMsgToggle">
            <label class="form-check-label text-xs" for="systemMsgToggle">SYS</label>
          </div>
          <button id="sendBtn" class="btn btn-send futuristic-btn">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </div>
      <div class="drop-hint text-center text-muted small py-2">📁 Drop files here to attach</div>
    </div>
  </main>

  <!-- Left Drawer: chats List -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="chatsDrawer">
    <div class="offcanvas-header futuristic-header">
      <h5 class="offcanvas-title"><i class="bi bi-chat-square-text me-2"></i>chats</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0" id="chatsList">
      <!-- Dynamic chat cards -->
    </div>
    <div class="offcanvas-footer p-3 border-top border-secondary">
      <button class="btn btn-outline-future w-100" id="newchatBtn">
        <i class="bi bi-plus-lg me-2"></i>New chat
      </button>
    </div>
  </div>

  <!-- Right Drawer: Current Chat History -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="historyDrawer">
    <div class="offcanvas-header futuristic-header">
      <h5 class="offcanvas-title"><i class="bi bi-journal-text me-2"></i>Message History</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0" id="historyList">
      <!-- Dynamic history items -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="script.js" type="module"></script>
</body>
</html>
